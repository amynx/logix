# Despliega ESTA rama (redisenio) a GitHub Pages en la subruta /preview, sin tocar
# el sitio de main. Publica en la rama gh-pages con keep_files para no borrar la raiz.
name: Deploy preview

on:
  push:
    branches: [feat/expression-builder-ux]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build:css

      # Reúne solo los archivos estáticos que sirve la app (sin node_modules ni tests).
      - name: Assemble static site
        run: |
          mkdir -p dist
          cp index.html guia.html dist/
          cp -r src dist/

      - name: Publish to gh-pages/preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview
          keep_files: true
