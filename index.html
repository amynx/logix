<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logix — Análisis de problemas</title>
  <link rel="stylesheet" href="./src/styles/app.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <!-- Barra superior -->
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3">
      <div class="flex items-center gap-2">
        <span class="text-lg font-semibold text-slate-900">Logix</span>
        <span class="hidden text-sm text-slate-400 sm:inline">Análisis de problemas</span>
      </div>
      <div id="toolbar" class="flex items-center gap-2"></div>
    </div>
  </header>

  <!-- Información del análisis (título y descripción) -->
  <section id="analysis-info" class="mx-auto max-w-7xl px-4 py-6"></section>

  <!-- Tabla de análisis -->
  <main id="table-container" class="mx-auto max-w-7xl px-4 pb-6"></main>

  <!-- Cadena derivada: Entradas → Proceso → Salida -->
  <section id="chain-container" class="mx-auto max-w-7xl px-4 pb-16"></section>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
