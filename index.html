<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logix — Análisis de problemas</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%226%22%20fill%3D%22%234f46e5%22%2F%3E%3Cg%20stroke%3D%22%23ffffff%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%3E%3Cline%20x1%3D%227%22%20y1%3D%228%22%20x2%3D%2213%22%20y2%3D%2214%22%2F%3E%3Cline%20x1%3D%2217%22%20y1%3D%227%22%20x2%3D%2213%22%20y2%3D%2214%22%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%22%23ffffff%22%3E%3Ccircle%20cx%3D%2213%22%20cy%3D%2214%22%20r%3D%222.6%22%2F%3E%3Ccircle%20cx%3D%227%22%20cy%3D%228%22%20r%3D%221.8%22%2F%3E%3Ccircle%20cx%3D%2217%22%20cy%3D%227%22%20r%3D%221.4%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" />
  <link rel="stylesheet" href="./src/styles/app.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <!-- Barra superior -->
  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-[100rem] items-center justify-between gap-4 px-4 py-3">
      <div class="flex min-w-0 items-center gap-2.5">
        <!-- Logo: una pequeña red de nodos conectados (de distintos tamaños) -->
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-indigo-600" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none">
            <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round">
              <line x1="6" y1="7" x2="12" y2="13" />
              <line x1="17" y1="5" x2="12" y2="13" />
              <line x1="6" y1="18" x2="12" y2="13" />
              <line x1="18" y1="16" x2="12" y2="13" />
              <line x1="17" y1="5" x2="18" y2="16" />
            </g>
            <g fill="#ffffff">
              <circle cx="12" cy="13" r="2.7" />
              <circle cx="6" cy="7" r="1.9" />
              <circle cx="18" cy="16" r="1.7" />
              <circle cx="17" cy="5" r="1.3" fill-opacity="0.85" />
              <circle cx="6" cy="18" r="1.2" fill-opacity="0.85" />
            </g>
          </svg>
        </span>
        <span class="text-lg font-semibold text-indigo-700">Logix</span>
        <span class="hidden text-sm text-slate-400 sm:inline">· Análisis de problemas</span>
        <!-- Indicador de guardado: ranura estable para que su estado no altere el layout -->
        <span id="save-status" class="ml-1"></span>
      </div>
      <div id="toolbar" class="flex flex-wrap items-center justify-end gap-2"></div>
    </div>
  </header>

  <div class="mx-auto max-w-[100rem] px-4 pb-16">
    <!-- 1. Estudiantes (grupo común + lista) -->
    <section id="students-container" class="max-w-4xl py-6"></section>

    <!-- 2. Información del análisis (título y descripción) -->
    <section id="analysis-info" class="max-w-4xl pb-6"></section>

    <!-- 3. Datos de entrada declarados -->
    <section id="inputs-container" class="max-w-4xl pb-6"></section>

    <!-- 4. Actividades: tabla o tarjetas -->
    <main id="table-container" class="pb-6"></main>

    <!-- 5. Cadena derivada: Entradas → Proceso → Salida -->
    <section id="chain-container"></section>
  </div>

  <!-- Área de impresión para la exportación a PDF (oculta en pantalla) -->
  <div id="print-area"></div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
